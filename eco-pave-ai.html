var LAYER_COLOR={WEARING_COURSE_BC:"#4b5768",BINDER_COURSE_DBM:"#333d4b",GRANULAR_BASE_WMM:"#c68a4e",GRANULAR_SUBBASE_GSB:"#8a6d4a",RIGID_SLAB_PQC:"#9aa5b1",RIGID_SUBBASE_DLC:"#7c8a9a"};
function renderLayers(all){
  var design=all.design, carbon=all.carbon, boq=all.boq;
  var msa=design.msa, subgrade=design.subgrade, layers=design.layers, total=design.totalPavementThicknessMm;
  var bars=layers.map(function(l){
    var h=Math.max(28,(l.thicknessMm/total)*260);
    var sel=state.selectedLayer===l.key?" selected":"";
    return '<div class="crossbar'+sel+'" style="height:'+h+'px;background:'+LAYER_COLOR[l.key]+'" onclick="selectLayer(\''+l.key+'\')"><span class="l">'+esc(l.label)+'</span><span class="r mono">'+l.thicknessMm+' mm</span></div>';
  }).join("");
  var rows=layers.map(function(l){
    var status;
    if(l.minimumThicknessMm==null) status='<span style="color:var(--paper-dim);">\u2014</span>';
    else if(l.belowMinimum) status='<span style="color:var(--amber);">Below catalogue</span>';
    else if(l.thicknessMm>l.minimumThicknessMm) status='<span style="color:var(--eco);">+'+(l.thicknessMm-l.minimumThicknessMm)+' mm over min</span>';
    else status='<span style="color:var(--eco);">Meets catalogue</span>';
    return '<tr style="cursor:pointer;" onclick="selectLayer(\''+l.key+'\')"><td>'+esc(l.label)+'</td><td class="mono" style="color:var(--signal);">'+esc(l.mixLabel)+'</td>'+
      '<td class="right mono">'+l.thicknessMm+' mm</td><td class="right mono" style="color:var(--paper-dim);">'+(l.minimumThicknessMm==null?"\u2014":l.minimumThicknessMm+" mm")+'</td><td style="font-size:12px;">'+status+'</td>'+
      '<td style="color:var(--paper-dim);font-size:12px;">'+esc(l.governingClause)+'</td></tr>';
  }).join("");
  var detail="";
  if(state.selectedLayer){
    var l=layers.filter(function(x){return x.key===state.selectedLayer;})[0];
    if(l){
      var boqItem=boq.lineItems.filter(function(x){return x.layerKey===l.key;})[0];
      var carbonItem=carbon.sustainableEntries.filter(function(x){return x.layerKey===l.key;})[0];
      detail='<div class="layer-detail"><div class="dtitle">'+esc(l.label)+' \u2014 Specification</div>'+
        '<div class="drow"><span>Material mix</span><span class="mono" style="color:var(--signal);">'+esc(l.mixLabel)+'</span></div>'+
        '<div class="drow"><span>Design thickness</span><span class="mono">'+l.thicknessMm+' mm</span></div>'+
        (l.minimumThicknessMm!=null?'<div class="drow"><span>IRC catalogue minimum</span><span class="mono">'+l.minimumThicknessMm+' mm</span></div>':'')+
        '<div class="drow"><span>Governing clause</span><span>'+esc(l.governingClause)+'</span></div>'+
        (boqItem?'<div class="drow"><span>Volume \u00B7 Weight</span><span class="mono">'+fmtNum(boqItem.volumeM3,0)+' m\u00B3 \u00B7 '+(boqItem.tonnage==null?"\u2014":fmtNum(boqItem.tonnage,0)+" t")+'</span></div>'+
          '<div class="drow"><span>Cost</span><span class="mono">'+inr(boqItem.amount)+'</span></div>':'')+
        (carbonItem?'<div class="drow"><span>Embodied carbon</span><span class="mono" style="color:var(--eco);">'+fmtNum(carbonItem.emissionsKgCo2e,0)+' kg CO\u2082e</span></div>':'')+
        '</div>';
    }
  }
  var compareBtn=design.pavementType==="rigid"?'':'<button class="btn btn-ghost" onclick="toggleCompare()">'+(state.compareOpen?"Hide":"Compare")+' Scenarios</button>';
  var methodDisclaimer=design.pavementType==="rigid"?"":
    '<div class="panel" style="border-color:var(--amber);margin-bottom:24px;"><div class="panel-header"><h3 style="color:var(--amber);">Design method \u2014 read before use</h3></div><div class="panel-body">'+
    '<p class="p-note" style="margin:0;color:var(--paper);">These layer thicknesses come from the <strong>IRC:37-2018 crust catalogue</strong> (a lookup against design traffic in MSA and subgrade CBR). IRC:37-2018 is officially a <strong>mechanistic-empirical</strong> code: the catalogue is meant to be independently verified by computing the tensile strain at the bottom of the bituminous layer (fatigue) and the compressive strain at the top of the subgrade (rutting) using layered-elastic analysis (e.g. IITPAVE). This app now includes a <strong>simplified Odemark\u2013Boussinesq estimate of the subgrade rutting strain</strong> as a first-pass cross-check \u2014 see <button type="button" class="link-btn" style="display:inline;padding:0;font-size:inherit;" onclick="selectSection(\'compare\')">09 Comparisons</button> \u2014 but the fatigue strain still needs a genuine multi-layer IITPAVE run, which this app does not perform. Treat these thicknesses as a planning-level estimate and get them verified against IITPAVE (or by a qualified pavement engineer) before using them for construction.</p></div></div>';
  return ''+
  methodDisclaimer+
  '<div class="grid3">'+
    '<div class="stat-card"><div class="lbl">Cumulative Standard Axles'+glossBadge("MSA")+'</div><div class="val"><span class="num">'+msa.cumulativeStandardAxlesMsa.toFixed(2)+'</span><span class="unit">msa</span></div>'+
      '<div class="note">'+(msa.usedLinearApproximation?"Linear approx. (r \u2248 0)":"Compound growth")+' \u00B7 '+fmtNum(msa.commercialVehiclesPerDay,0)+' CV/day</div></div>'+
    clauseNoteWide("MSA")+
    '<div class="stat-card"><div class="lbl">Subgrade Resilient Modulus'+glossBadge("MR")+'</div><div class="val"><span class="num">'+subgrade.resilientModulusMPa.toFixed(1)+'</span><span class="unit">MPa</span></div>'+
      '<div class="note">CBR '+subgrade.cbrPercent+'% \u00B7 '+subgrade.category+'</div></div>'+
    clauseNoteWide("MR")+
    '<div class="stat-card"><div class="lbl">Total Pavement Crust</div><div class="val"><span class="num">'+total+'</span><span class="unit">mm</span></div>'+
      '<div class="note">'+layers.length+' structural layers \u00B7 '+(design.pavementType==="rigid"?"Rigid (IRC:58)":"Flexible (IRC:37)")+'</div></div>'+
  '</div>'+
  '<div class="panel" style="margin-top:24px;"><div class="panel-header"><h3>Pavement Cross-Section \u2014 Elevation <span>(click a layer to inspect)</span></h3>'+compareBtn+'</div>'+
    '<div class="panel-body" style="display:flex;justify-content:center;"><div style="width:100%;max-width:560px;">'+bars+
    '<div class="subgrade-bar"><span>NATURAL SUBGRADE \u2014 CBR '+subgrade.cbrPercent+'%</span></div>'+detail+'</div></div></div>'+
  (state.compareOpen&&design.pavementType!=="rigid"?renderCompareDrawer(all):"")+
  '<div class="panel"><div class="panel-header"><h3>Layer Design Register</h3></div><div class="table-wrap"><table style="min-width:720px;">'+
    '<thead><tr><th>Layer</th><th>Material</th><th class="right">Thickness</th><th class="right">IRC min</th><th>Status</th><th>Governing Clause</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function renderCompareDrawer(all){
  var carbon=all.carbon, baseCarbon=all.baseCarbon, boq=all.boq, baseBoq=all.baseBoq, design=all.design, baseDesign=all.baseDesign;
  function col(label,cls,d,b,cb){
    return '<div class="compare-col '+cls+'"><h4>'+esc(label)+'</h4>'+
      '<div class="compare-metric"><span>Total crust</span><span>'+d.totalPavementThicknessMm+' mm</span></div>'+
      '<div class="compare-metric"><span>Grand total cost (incl. 5%)</span><span>'+inr(b.grandTotal)+'</span></div>'+
      '<div class="compare-metric"><span>Embodied carbon</span><span>'+(cb.sustainableTotalKgCo2e/1000).toFixed(2)+' t CO\u2082e</span></div>'+
      '<div class="compare-metric"><span>Intensity</span><span>'+cb.sustainableIntensityKgCo2ePerM2.toFixed(2)+' kg/m\u00B2</span></div></div>';
  }
  var costDelta=baseBoq.grandTotal-boq.grandTotal, carbonDelta=(baseCarbon.sustainableTotalKgCo2e-carbon.sustainableTotalKgCo2e)/1000;
  return '<div class="compare-panel"><div class="panel-header"><h3>Live Scenario Comparison <span>\u2014 Variant A vs Variant B</span></h3></div>'+
    '<div class="compare-grid">'+col("Variant A \u2014 Conventional HMA","a",baseDesign,baseBoq,baseCarbon)+col("Variant B \u2014 "+carbon.sustainableLabel,"b",design,boq,carbon)+'</div>'+
    '<div class="compare-delta">Variant B '+(costDelta>=0?"saves ":"costs ")+inr(Math.abs(costDelta))+' and avoids '+carbonDelta.toFixed(2)+' t CO\u2082e on this project.</div></div>';
}

function renderCarbon(all){
  var carbon=all.carbon, boq=all.boq, baseBoq=all.baseBoq, s=state.config.sustainability, rigid=state.config.pavementType==="rigid";
  var maxTotal=Math.max(carbon.baselineTotalKgCo2e,carbon.sustainableTotalKgCo2e,1);
  function barRow(label,valueKg,color){
    var pct=Math.max(2,(valueKg/maxTotal)*100);
    return '<div class="barrow"><div class="toprow"><span style="color:var(--paper-dim);">'+esc(label)+'</span><span class="mono">'+(valueKg/1000).toFixed(2)+' t CO\u2082e</span></div>'+
      '<div class="track"><div class="fill" style="width:'+pct+'%;background:'+color+'"></div></div></div>';
  }
  var rows=carbon.sustainableEntries.map(function(e){
    return '<tr><td>'+e.layerKey.replace(/_/g," ")+'</td><td class="mono" style="color:var(--signal);">'+esc(e.mixLabel)+'</td>'+
      '<td class="right mono">'+e.quantity.toLocaleString("en-IN")+' '+e.unit+'</td><td class="right mono" style="color:var(--paper-dim);">'+e.factor+'</td>'+
      '<td class="right mono" style="color:var(--eco);">'+e.emissionsKgCo2e.toLocaleString("en-IN")+'</td></tr>';
  }).join("");
  var costSave=all.costSavingInr, tSaved=carbon.savingsKgCo2e/1000;
  var abate="";
  if(tSaved>0.0001){
    var perT=-costSave/tSaved;
    abate=perT<=0?'Saves '+inr(Math.abs(perT))+' for every tonne of CO\u2082e avoided':'Costs '+inr(perT)+' per tonne of CO\u2082e avoided';
  } else { abate="Enable WMA and/or RAP to see abatement cost"; }
  var dim='opacity:.45;';
  var controls=rigid?
    '<div class="panel"><div class="panel-body"><p class="p-note">The rigid (PQC) stack has no bituminous layers, so WMA / RAP do not apply and baseline equals sustainable. Switch pavement type to Flexible in 01 Configuration to use these controls.</p></div></div>':
    '<div class="panel"><div class="panel-header"><h3>Sustainable Mix Controls <span>\u2014 WMA & RAP (A1\u2013A3)</span></h3></div><div class="panel-body grid2">'+
      '<div style="display:flex;flex-direction:column;gap:12px;">'+
        '<label class="checkbox-row"><input type="checkbox" '+(s.wmaEnabled?"checked":"")+' onchange="setWmaEnabled(this.checked)" style="accent-color:var(--eco);width:18px;height:18px;">'+
        '<span style="font-size:13px;font-weight:600;color:var(--paper);">Warm Mix Asphalt (WMA)</span>'+glossBadge("WMA")+'</label>'+
        clauseNote("WMA")+
        '<div style="'+(s.wmaEnabled?"":dim)+'">'+field("WMA emission reduction","% of mix CO\u2082e",s.wmaReductionPercent,0,30,0.5,"setWmaPct")+'</div>'+
      '</div>'+
      '<div style="display:flex;flex-direction:column;gap:12px;">'+
        '<label class="checkbox-row"><input type="checkbox" '+(s.rapEnabled?"checked":"")+' onchange="setRapEnabled(this.checked)" style="accent-color:var(--eco);width:18px;height:18px;">'+
        '<span style="font-size:13px;font-weight:600;color:var(--paper);">Reclaimed Asphalt Pavement (RAP)</span>'+glossBadge("RAP")+'</label>'+
        clauseNote("RAP")+
        '<div style="'+(s.rapEnabled?"":dim)+'">'+field("RAP content","% of mix",s.rapPercent,0,40,1,"setRapPct")+'</div>'+
      '</div>'+
      '<p class="p-note" style="grid-column:1/-1;margin:0;">Model: emission factor = [(1 \u2212 RAP) \u00D7 '+BASE_HMA_KG_PER_T+' + RAP \u00D7 '+RAP_PROCESS_KG_PER_T+'] \u00D7 (1 \u2212 WMA reduction) kg CO\u2082e per tonne. The HMA factor, RAP re-processing factor and the WMA reduction are planning assumptions \u2014 replace them with your EPD or plant data, and confirm the RAP content allowed by IRC:120 and the project specification.</p>'+
    '</div></div>';
  return ''+
  '<div style="display:flex;justify-content:flex-end;margin-bottom:20px;"><button class="btn btn-eco" onclick="downloadCarbon()">Download Carbon Ledger Report</button></div>'+
  controls+
  '<div class="grid3">'+
    '<div class="stat-card"><div class="lbl">Baseline Footprint (HMA)</div><div class="val"><span class="num" style="color:var(--paper);">'+(carbon.baselineTotalKgCo2e/1000).toFixed(2)+'</span><span class="unit">t CO\u2082e</span></div></div>'+
    '<div class="stat-card"><div class="lbl">Sustainable Footprint</div><div class="val eco"><span class="num">'+(carbon.sustainableTotalKgCo2e/1000).toFixed(2)+'</span><span class="unit">t CO\u2082e</span></div><div class="note">'+esc(carbon.sustainableLabel)+'</div></div>'+
    '<div class="stat-card"><div class="lbl">Carbon Savings</div><div class="val eco"><span class="num">'+carbon.savingsPercent.toFixed(1)+'%</span></div><div class="note">'+(carbon.savingsKgCo2e/1000).toFixed(2)+' t CO\u2082e avoided</div></div>'+
  '</div>'+
  '<div class="grid3" style="margin-top:16px;">'+
    '<div class="stat-card"><div class="lbl">Baseline Cost (incl. 5%)</div><div class="val"><span class="num" style="color:var(--paper);font-size:20px;">'+inrShort(baseBoq.grandTotal)+'</span></div><div class="note">Conventional HMA surfacing</div></div>'+
    '<div class="stat-card"><div class="lbl">Sustainable Cost (incl. 5%)</div><div class="val"><span class="num" style="font-size:20px;">'+inrShort(boq.grandTotal)+'</span></div><div class="note">Current mix and rates</div></div>'+
    '<div class="stat-card"><div class="lbl">Net Cost Saving</div><div class="val '+(costSave>=0?"eco":"")+'"><span class="num" style="font-size:20px;'+(costSave<0?"color:var(--amber);":"")+'">'+(costSave<0?"\u2212 ":"")+inrShort(Math.abs(costSave))+'</span></div><div class="note">'+(costSave<0?"Extra cost vs baseline \u00B7 ":"")+esc(abate)+'</div></div>'+
  '</div>'+
  '<div class="panel" style="margin-top:24px;"><div class="panel-header"><h3>Cradle-to-Gate (A1\u2013A3) Comparison</h3></div><div class="panel-body" style="display:flex;flex-direction:column;gap:20px;">'+

  '<div class="grid2">'+
    '<div class="stat-card"><div class="lbl" style="margin-bottom:4px;">Baseline Intensity</div><div class="mono" style="font-size:18px;color:var(--paper);">'+carbon.baselineIntensityKgCo2ePerM2.toFixed(2)+' <span style="font-size:12px;color:var(--paper-dim);">kg CO\u2082e / m\u00B2</span></div></div>'+
    '<div class="stat-card"><div class="lbl" style="margin-bottom:4px;">Sustainable Intensity</div><div class="mono" style="font-size:18px;color:var(--eco);">'+carbon.sustainableIntensityKgCo2ePerM2.toFixed(2)+' <span style="font-size:12px;color:var(--paper-dim);">kg CO\u2082e / m\u00B2</span></div></div>'+
  '</div>'+
  '<div class="panel" style="margin-top:24px;"><div class="panel-header"><h3>Emissions by Layer \u2014 Sustainable Scenario</h3></div><div class="table-wrap"><table style="min-width:600px;">'+
    '<thead><tr><th>Layer</th><th>Mix</th><th class="right">Quantity</th><th class="right">kg CO\u2082e / unit</th><th class="right">Emissions (kg CO\u2082e)</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function renderBoq(all){

  var rows=boq.lineItems.map(function(i){
    return '<tr><td>'+esc(i.description)+'</td><td class="mono" style="color:var(--signal);">'+esc(i.mixLabel)+'</td>'+
      '<td class="right mono">'+(i.thicknessMm==null?"\u2014":i.thicknessMm+" mm")+'</td>'+

      '<td class="right mono" style="color:var(--signal);">'+inr(i.amount)+'</td></tr>';

  return ''+
  '<div style="display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-bottom:20px;">'+
    '<button class="btn btn-ghost" onclick="openReport()">Engineering Report</button>'+
    '<button class="btn btn-signal" onclick="downloadBoq()"'+(hasUnacknowledgedShortfall(all.design.layers)?' disabled title="Acknowledge the below-catalogue thickness warning on the Configuration/Layers tab first"':'')+'>Download BOQ CSV</button></div>'+
  '<div class="grid3">'+
    '<div class="stat-card"><div class="lbl">Base Cost (Subtotal)</div><div class="mono" style="font-size:20px;color:var(--paper);margin-top:8px;">'+inr(boq.subtotal)+'</div><div class="note">'+inrShort(boq.subtotal)+'</div></div>'+
    '<div class="stat-card"><div class="lbl">Contingency ('+boq.contingencyPercent+'%)</div><div class="mono" style="font-size:20px;color:var(--paper);margin-top:8px;">'+inr(boq.contingencyAmount)+'</div></div>'+
    '<div class="stat-card"><div class="lbl">Grand Total</div><div class="mono" style="font-size:20px;color:var(--signal);margin-top:8px;">'+inr(boq.grandTotal)+'</div><div class="note">'+inrShort(boq.grandTotal)+' \u00B7 '+fmtNum(boq.totalVolumeM3,0)+' m\u00B3 \u00B7 '+fmtNum(boq.totalTonnage,0)+' t</div></div>'+

function buildCadPreviewSvg(layers,geometry,exag){
  var formationWidthMm=(geometry.carriagewayWidthM+2*geometry.shoulderWidthM)*1000;
  var geoms=buildLayerGeometry(layers,formationWidthMm,geometry.crossFallPercent,exag);
  var halfWidth=formationWidthMm/2, maxDepth=0;
  geoms.forEach(function(g){ g.points.forEach(function(p){ var d=-p[1]; if(d>maxDepth)maxDepth=d; }); });
  var padX=halfWidth*0.1, padY=maxDepth*0.18+30;
  var minX=-halfWidth-padX, width=formationWidthMm+2*padX, minY=-padY, height=maxDepth+2*padY;
  var sw=Math.max(maxDepth,formationWidthMm)*0.003;
  var polys=geoms.map(function(g){
    var pts=g.points.map(function(p){ return p[0]+","+(-p[1]); }).join(" ");
    return '<polygon points="'+pts+'" fill="'+LAYER_COLOR[g.layer.key]+'" stroke="#0b1120" stroke-width="'+sw+'"/>';
  }).join("");
  return '<svg viewBox="'+minX+' '+minY+' '+width+' '+height+'" xmlns="http://www.w3.org/2000/svg">'+
    '<rect x="'+minX+'" y="'+minY+'" width="'+width+'" height="'+height+'" fill="#0b1120"/>'+polys+
    '<line x1="0" y1="'+minY+'" x2="0" y2="'+(maxDepth+padY*0.3)+'" stroke="#38bdf8" stroke-width="'+sw*0.6+'" stroke-dasharray="'+(maxDepth*0.012)+' '+(maxDepth*0.012)+'"/>'+
    '</svg>';
}

function renderRigid(rg,pavementType,geometry){

  var srColor=r.stressRatio<0.45?"var(--eco)":(r.stressRatio<=0.55?"var(--amber)":"var(--warn)");
  function srCell(sr){ return '<span style="color:'+(sr<0.45?"var(--eco)":(sr<=0.55?"var(--amber)":"var(--warn)"))+';">'+sr.toFixed(3)+'</span>'; }
  function row(name,stress,sr,mode){
    var gov=(r.governing===mode);
    return '<tr'+(gov?' style="background:var(--ink-800);"':'')+'><td>'+name+(gov?' <span class="pill on" style="margin-left:6px;">governing</span>':'')+'</td>'+
      '<td class="right mono">'+stress.toFixed(3)+' MPa</td><td class="right mono">'+srCell(sr)+'</td></tr>';
  }
  var fatigueText, fatigueColor;
  if(r.allowableRepetitions===Infinity){ fatigueText="Unlimited repetitions (SR < 0.45)"; fatigueColor="var(--eco)"; }
  else { fatigueText=fmtReps(r.allowableRepetitions)+" repetitions allowed"; fatigueColor=r.stressRatio<=0.55?"var(--amber)":"var(--warn)"; }
  var damageColor=r.fatigueDamage<=1?"var(--eco)":"var(--warn)";
  var linkBox=isRigidProject?
    '<p class="p-note" style="margin:0;">This slab thickness ('+rg.slabThicknessMm+' mm) is the PQC layer in the BOQ, carbon ledger and CAD section of this project.</p>':
    '<p class="p-note" style="margin:0 0 10px;">The project is currently <strong style="color:var(--paper);">Flexible</strong>, so this check is stand-alone. Switch the project to Rigid to use this slab thickness in the BOQ, carbon ledger and CAD section.</p>'+

    field("Slab thickness, h","mm",rg.slabThicknessMm,150,400,10,"setRigidThickness")+
    field("Concrete elastic modulus, E","MPa",rg.concreteEMPa,20000,40000,500,"setRigidE")+
    field("Poisson's ratio, \u03BC","",rg.poissonRatio,0.1,0.2,0.01,"setRigidPoisson")+
    field("Modulus of subgrade reaction, K","MPa/m",rg.subgradeKMPaPerM,20,150,5,"setRigidK")+
    field("Tyre contact radius, a","mm",rg.contactRadiusMm,75,200,5,"setRigidContact")+

    '<div style="grid-column:1/-1;">'+linkBox+'</div>'+
    '</div></div>'+
  '<div class="grid3">'+
    '<div class="stat-card"><div class="lbl">Radius of Relative Stiffness, l</div><div class="val"><span class="num">'+r.radiusOfRelativeStiffnessMm.toFixed(0)+'</span><span class="unit">mm</span></div><div class="note">Equivalent radius of resisting section b = '+r.bMm.toFixed(1)+' mm</div></div>'+

  clauseNote("SR")+

function fmtMicrostrain(v){ return v.toFixed(0)+" \u03BC\u03B5"; }
function strainStatusColor(s){ return s==="ok"?"var(--eco)":(s==="borderline"?"var(--amber)":"var(--warn)"); }
function strainStatusLabel(s){ return s==="ok"?"Within typical range":(s==="borderline"?"Borderline \u2014 verify with IITPAVE":"High \u2014 verify with IITPAVE before use"); }
function renderStrainPanel(strain){
  if(!strain) return '<div class="panel"><div class="panel-body"><p class="p-note" style="margin:0;">The simplified strain check applies to flexible (IRC:37) pavements only; switch to Flexible in 01 Configuration to see it.</p></div></div>';
  return '<div class="panel" style="border-color:var(--signal);"><div class="panel-header"><h3>Simplified Strain-Based Check <span>\u2014 Odemark\u2013Boussinesq approximation of IITPAVE</span></h3></div>'+
    '<div class="panel-body">'+
    '<p class="p-note" style="margin:0 0 14px;color:var(--paper);">IRC:37-2018 is a mechanistic-empirical code: the crust catalogue is meant to be cross-checked against the compressive strain at the top of the subgrade (rutting) and the tensile strain at the bottom of the bituminous layer (fatigue), normally via a full layered-elastic run in <strong>IITPAVE</strong>. This panel estimates the <strong>subgrade rutting strain</strong> using Odemark\u2019s Method of Equivalent Thicknesses + Boussinesq\u2019s closed-form elastic solution \u2014 a recognised, defensible hand-calculation substitute for that one quantity. The complementary <strong>fatigue tensile strain</strong> at the bottom of the asphalt genuinely needs a multi-layer (Burmister) bending solution that a simple single-point substitution cannot reliably approximate, so this app does not report a fatigue-strain number rather than show one that could be misleading \u2014 that check still needs an actual IITPAVE run. <strong style="color:var(--amber);">Treat the rutting estimate below as an indicative cross-check, not a replacement for IITPAVE.</strong></p>'+
    '<div class="grid2">'+
      '<div class="stat-card"><div class="lbl">Vertical Strain, \u03B5<sub>v</sub> (top of subgrade)</div><div class="val"><span class="num" style="color:'+strainStatusColor(strain.ruttingStatus)+';">'+fmtMicrostrain(strain.epsilonVMicrostrain)+'</span></div>'+
        '<div class="note">Typical band for '+strain.designMsa.toFixed(1)+' msa: '+strain.ruttingBandMicrostrain[0]+'\u2013'+strain.ruttingBandMicrostrain[1]+' \u03BC\u03B5 \u00B7 <span style="color:'+strainStatusColor(strain.ruttingStatus)+';">'+strainStatusLabel(strain.ruttingStatus)+'</span></div></div>'+
      '<div class="stat-card"><div class="lbl">Tensile Strain, \u03B5<sub>t</sub> (bottom of bituminous layer)</div><div class="val"><span class="num" style="color:var(--paper-dim);font-size:16px;">Not computed</span></div>'+
        '<div class="note">Needs a genuine multi-layer (Burmister/IITPAVE) bending solution \u2014 run IITPAVE for this quantity.</div></div>'+
    '</div>'+
    '<div class="table-wrap" style="margin-top:16px;"><table style="min-width:520px;"><thead><tr><th>Quantity</th><th class="right">Value</th></tr></thead><tbody>'+
      '<tr><td>Bituminous thickness used (BC+DBM)</td><td class="right mono">'+strain.hBitMm+' mm</td></tr>'+
      '<tr><td>Granular thickness used (WMM+GSB)</td><td class="right mono">'+strain.hGranMm+' mm</td></tr>'+
      '<tr><td>Bituminous modulus, E<sub>bit</sub> (typical, verify)</td><td class="right mono">'+strain.Ebit+' MPa</td></tr>'+
      '<tr><td>Granular modulus, E<sub>gran</sub> (IRC:37 correlation)</td><td class="right mono">'+strain.Egran+' MPa</td></tr>'+
      '<tr><td>Subgrade modulus, E<sub>sub</sub></td><td class="right mono">'+strain.Esub.toFixed(1)+' MPa</td></tr>'+
      '<tr><td>Standard-axle contact pressure / radius</td><td class="right mono">'+strain.contactPressureMPa+' MPa / '+strain.contactRadiusMm.toFixed(1)+' mm</td></tr>'+
      '<tr><td>Odemark equivalent depth \u2014 rutting check</td><td class="right mono">'+strain.heRutMm.toFixed(0)+' mm</td></tr>'+
    '</tbody></table></div>'+
    '<p class="p-note" style="margin:14px 0 0;">The \u201ctypical band\u201d above is an order-of-magnitude reference range seen in mechanistic-empirical practice for this traffic level \u2014 it is <strong>not</strong> the IRC:37-2018 Annexure-3 rutting transfer-function output (this app does not reproduce those coefficients numerically). For a governing allowable-repetitions number, run this strain through IITPAVE or the Annexure-3 equations directly from your copy of the code.</p>'+
    '</div></div>';
}
function compareRow(label,std,cur,fmt,goodDir){
  fmt=fmt||function(v){return String(v);};
  var same=Math.abs(std-cur)<1e-9;
  var delta=cur-std, up=delta>0;
  var deltaColor=same?"var(--paper-dim)":((goodDir==="down"&&!up)||(goodDir==="up"&&up)?"var(--eco)":"var(--amber)");
  return '<tr><td>'+esc(label)+'</td><td class="right mono">'+fmt(std)+'</td><td class="right mono" style="color:'+(same?"var(--paper)":"var(--signal)")+';">'+fmt(cur)+'</td>'+
    '<td class="right mono" style="color:'+deltaColor+';">'+(same?"\u2014":(up?"+":"")+fmt(delta))+'</td></tr>';
}
function renderCompare(all){

    '<div class="table-wrap"><table style="min-width:560px;"><thead><tr><th></th><th class="right">Flexible (IRC:37)</th><th class="right">Rigid (IRC:58)</th></tr></thead><tbody>'+
    '<tr><td>Total crust thickness</td><td class="right mono">'+tc.flexible.design.totalPavementThicknessMm+' mm</td><td class="right mono">'+tc.rigid.design.totalPavementThicknessMm+' mm</td></tr>'+
    '<tr><td>Grand total cost (incl. 5%)</td><td class="right mono">'+inr(tc.flexible.boq.grandTotal)+'</td><td class="right mono">'+inr(tc.rigid.boq.grandTotal)+'</td></tr>'+
    '<tr><td>Embodied carbon</td><td class="right mono">'+(tc.flexible.carbon.sustainableTotalKgCo2e/1000).toFixed(2)+' t CO\u2082e</td><td class="right mono">'+(tc.rigid.carbon.sustainableTotalKgCo2e/1000).toFixed(2)+' t CO\u2082e</td></tr>'+
    '<tr><td>Carbon intensity</td><td class="right mono">'+tc.flexible.carbon.sustainableIntensityKgCo2ePerM2.toFixed(2)+' kg/m\u00B2</td><td class="right mono">'+tc.rigid.carbon.sustainableIntensityKgCo2ePerM2.toFixed(2)+' kg/m\u00B2</td></tr>'+
    '</tbody></table></div>'+
    '<div class="compare-delta" style="margin-top:12px;">Rigid '+(tc.costDeltaInr>=0?"costs "+inr(tc.costDeltaInr)+" more":"costs "+inr(Math.abs(tc.costDeltaInr))+" less")+' and '+(tc.carbonDeltaKg>=0?"emits "+(tc.carbonDeltaKg/1000).toFixed(2)+" t CO\u2082e more":"emits "+(Math.abs(tc.carbonDeltaKg)/1000).toFixed(2)+" t CO\u2082e less")+' than Flexible for this project, on these inputs. Rigid pavements typically cost more up-front but have a longer design life and lower maintenance frequency \u2014 neither of those is modelled here, so use this as a first-pass material comparison, not a whole-life-cost decision.</div>'+
    '</div></div>';

  var stdRows;

      compareRow("Granular Base (WMM)",sl[2].thicknessMm,cl[2].thicknessMm,fMm)+

      compareRow("PQC slab thickness",slR[0].thicknessMm,clR[0].thicknessMm,fMm)+
      compareRow("DLC sub-base",slR[1].thicknessMm,clR[1].thicknessMm,fMm)+
      compareRow("Granular sub-base (GSB)",slR[2].thicknessMm,clR[2].thicknessMm,fMm)+
      compareRow("Concrete elastic modulus",DEFAULT_CONFIG.rigid.concreteEMPa,state.config.rigid.concreteEMPa,function(v){return v+" MPa";})+
      compareRow("Design flexural strength",DEFAULT_CONFIG.rigid.flexuralStrengthMPa,state.config.rigid.flexuralStrengthMPa,function(v){return v.toFixed(1)+" MPa";});
  }
  var overrideList=sc.overriddenFields.length?sc.overriddenFields.map(function(k){return '<span class="pill on" style="margin:0 6px 6px 0;">'+esc(k)+'</span>';}).join(""):
    '<span class="pill">No overrides \u2014 the current design already matches the standard/catalogue values</span>';
  var stdPanel='<div class="panel"><div class="panel-header"><h3>Standard (IRC catalogue / default) vs As-Overridden</h3></div>'+

    '<div style="margin-bottom:12px;">'+overrideList+'</div>'+
    '<div class="table-wrap"><table style="min-width:560px;"><thead><tr><th></th><th class="right">Standard</th><th class="right">As-Overridden</th><th class="right">Delta</th></tr></thead><tbody>'+stdRows+'</tbody></table></div>'+
    '<div class="table-wrap" style="margin-top:10px;"><table style="min-width:420px;"><tbody>'+

      '<tr><td>Embodied carbon</td><td class="right mono">'+(sc.standard.carbon.sustainableTotalKgCo2e/1000).toFixed(2)+' t CO\u2082e</td><td class="right mono">'+(sc.current.carbon.sustainableTotalKgCo2e/1000).toFixed(2)+' t CO\u2082e</td></tr>'+
    '</tbody></table></div>'+
    '<div class="compare-delta" style="margin-top:12px;">Your overrides '+(sc.costDeltaInr>=0?"save "+inr(sc.costDeltaInr):"cost "+inr(Math.abs(sc.costDeltaInr))+" extra")+' versus the standard design, and '+(sc.carbonDeltaKg>=0?"avoid "+(sc.carbonDeltaKg/1000).toFixed(2)+" t CO\u2082e":"add "+(Math.abs(sc.carbonDeltaKg)/1000).toFixed(2)+" t CO\u2082e")+' \u2014 remember a lighter-than-standard layer must be acknowledged (01/02) before exports unlock.</div>'+

var AUDIT_COLORS={Traffic:"#38bdf8",Subgrade:"#a78bfa",Geometry:"#22d3ee",Rates:"#fbbf24",Carbon:"#4ade80",Layers:"#fb923c",Geometrics:"#f472b6",Rigid:"#94a3b8",CAD:"#60a5fa",Project:"#e2e8f0",Revert:"#f87171",Legacy:"#64748b"};
function auditDot(cat){ return '<span style="flex:0 0 10px;width:10px;height:10px;border-radius:50%;background:'+(AUDIT_COLORS[cat]||"#94a3b8")+';display:inline-block;margin-top:4px;"></span>'; }
function fmtAuditTime(ms,full){
  var d=new Date(ms);
  try{
    return d.toLocaleString("en-GB",full?{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",fractionalSecondDigits:3,hour12:false}
      :{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  }catch(e){ return d.toLocaleTimeString(); }
}
function fmtAgo(ms){
  var s=Math.max(0,Math.round((Date.now()-ms)/1000));
  if(s<5) return "just now"; if(s<60) return s+" s ago"; if(s<3600) return Math.floor(s/60)+" min ago";
  if(s<86400) return Math.floor(s/3600)+" h ago"; return Math.floor(s/86400)+" d ago";
}
function auditChange(e){
  if(e.from===""&&e.to==="") return "";
  return '<span class="mono" style="color:var(--paper-dim);">'+esc(e.from)+'</span> <span style="color:var(--paper-dim);">\u2192</span> <span class="mono" style="color:var(--signal);">'+esc(e.to)+'</span>';
}
function renderAudit(){
  var log=state.auditLog, v=auditVerify();
  var toggle='<div style="display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;" role="group" aria-label="Audit view">'+
    '<button type="button" class="btn btn-sm '+(state.auditView==="activity"?"btn-signal":"btn-ghost")+'" style="border-radius:0;" aria-pressed="'+(state.auditView==="activity")+'" onclick="setAuditView(\'activity\')">Activity</button>'+
    '<button type="button" class="btn btn-sm '+(state.auditView==="history"?"btn-signal":"btn-ghost")+'" style="border-radius:0;" aria-pressed="'+(state.auditView==="history")+'" onclick="setAuditView(\'history\')">History</button></div>';
  var integrity=log.length===0?'':(v.ok?
    '<span class="pill on" title="Each entry is hash-linked to the one before it. This is a browser-side tamper check, not a cryptographic signature.">\u2713 Integrity chain verified \u00B7 '+log.length+' entries</span>':
    '<span class="pill" style="color:var(--warn);border-color:var(--warn);">\u26A0 Integrity check failed at entry #'+v.at+'</span>');
  var head='<div class="panel"><div class="panel-header" style="flex-wrap:wrap;gap:10px;"><h3>Audit Trail <span>\u2014 immutable change log</span></h3>'+

    (log.length?'<div class="panel-body" style="padding-top:10px;padding-bottom:10px;">'+integrity+'</div>':'');
  if(log.length===0){
    return head+'<div class="empty-note">Nothing logged yet. Every edit to traffic, subgrade, geometry, rates, sustainability, layers, road design, rigid check and CAD settings appears here with a timestamp and a one-click revert.</div></div>';
  }
  var body="", idxList=log.map(function(e,i){return i;}).reverse();
  if(state.auditView==="activity"){
    body=idxList.slice(0,12).map(function(i){
      var e=log[i];
      return '<div class="audit-item" style="align-items:flex-start;"><div style="display:flex;gap:10px;min-width:0;">'+auditDot(e.category)+
        '<div style="min-width:0;"><div style="font-weight:600;color:var(--paper);">'+esc(e.label)+(e.count>1?' <span class="mono" style="font-weight:400;color:var(--paper-dim);font-size:10.5px;">\u00D7'+e.count+' edits</span>':'')+'</div>'+
        '<div style="margin-top:2px;">'+auditChange(e)+'</div>'+
        '<div class="meta">'+esc(e.category)+' \u00B7 '+fmtAuditTime(e.ts,false)+' \u00B7 '+fmtAgo(e.ts)+'</div></div></div>'+
        '<button class="revert" onclick="requestRevert('+i+')">Revert</button></div>';
    }).join("");
    if(log.length>12) body+='<div class="empty-note" style="padding:12px 20px;">Showing the latest 12 of '+log.length+' entries \u2014 switch to History for the full register.</div>';
  } else {
    var cats=["All"]; log.forEach(function(e){ if(cats.indexOf(e.category)<0) cats.push(e.category); });
    if(cats.indexOf(state.auditFilter)<0) state.auditFilter="All";
    var chips='<div style="display:flex;flex-wrap:wrap;gap:6px;padding:12px 20px;border-bottom:1px solid var(--ink-800);">'+cats.map(function(c){
      var on=state.auditFilter===c;
      return '<button type="button" class="pill'+(on?" on":"")+'" style="cursor:pointer;" aria-pressed="'+on+'" onclick="setAuditFilter(\''+c+'\')">'+esc(c)+'</button>';
    }).join("")+'</div>';
    var rows=idxList.filter(function(i){ return state.auditFilter==="All"||log[i].category===state.auditFilter; }).map(function(i){
      var e=log[i];
      return '<tr><td class="mono" style="color:var(--paper-dim);">#'+e.id+'</td><td class="mono" style="white-space:nowrap;font-size:11.5px;">'+fmtAuditTime(e.ts,true)+'</td>'+
        '<td><span style="display:inline-flex;gap:6px;align-items:center;"><span style="width:8px;height:8px;border-radius:50%;background:'+(AUDIT_COLORS[e.category]||"#94a3b8")+';display:inline-block;"></span>'+esc(e.category)+'</span></td>'+
        '<td>'+esc(e.label)+'</td><td>'+auditChange(e)+'</td><td class="right mono">'+e.count+'</td>'+
        '<td class="right"><button class="btn btn-ghost btn-sm" onclick="requestRevert('+i+')">Revert</button></td></tr>';
    }).join("");
    body=chips+'<div class="table-wrap"><table style="min-width:760px;"><thead><tr><th>#</th><th>Timestamp</th><th>Category</th><th>Change</th><th>From \u2192 To</th><th class="right">Edits</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  return head+body+'</div>'+
    '<p class="p-note">The log is append-only: reverting restores the project exactly as it was before the selected change and adds a "Reverted" entry \u2014 nothing is deleted. Rapid edits to one field are grouped into a single entry (\u00D7 edits). The latest '+AUDIT_CAP+' entries are kept in this browser; export the CSV or a Design Report for a permanent compliance record.</p>';
}

function renderRevertConfirmModal(){

function renderCrossSectionCanvas(layers,geometry,exag){
  var formationWidthMm=(geometry.carriagewayWidthM+2*geometry.shoulderWidthM)*1000;
  var geoms=buildLayerGeometry(layers,formationWidthMm,geometry.crossFallPercent,exag);
  var halfWidth=formationWidthMm/2, maxDepth=0;
  geoms.forEach(function(g){ g.points.forEach(function(p){ var d=-p[1]; if(d>maxDepth)maxDepth=d; }); });
  var padX=halfWidth*0.1, padY=maxDepth*0.18+30;
  var worldW=formationWidthMm+2*padX, worldH=maxDepth+2*padY;
  var canvas=document.createElement("canvas"), pxPerUnit=900/worldW;
  canvas.width=Math.round(worldW*pxPerUnit); canvas.height=Math.round(worldH*pxPerUnit);
  var ctx=canvas.getContext("2d");
  ctx.fillStyle="#0b1120"; ctx.fillRect(0,0,canvas.width,canvas.height);
  function toPx(x,yDown){ return [ (x+halfWidth+padX)*pxPerUnit, (yDown+padY)*pxPerUnit ]; }
  geoms.forEach(function(g){
    ctx.beginPath();
    g.points.forEach(function(p,i){ var px=toPx(p[0],-p[1]); if(i===0) ctx.moveTo(px[0],px[1]); else ctx.lineTo(px[0],px[1]); });
    ctx.closePath(); ctx.fillStyle=LAYER_COLOR[g.layer.key]; ctx.fill();
    ctx.strokeStyle="#0b1120"; ctx.lineWidth=Math.max(1,canvas.width*0.002); ctx.stroke();
  });
  ctx.strokeStyle="#38bdf8"; ctx.setLineDash([6,6]); ctx.lineWidth=2;
  ctx.beginPath(); var cx=toPx(0,0)[0]; ctx.moveTo(cx,0); ctx.lineTo(cx,canvas.height); ctx.stroke();
  return canvas;
}
function pdfSafe(s){
  return String(s)
    .replace(/[\u2012\u2013\u2014\u2015]/g,"-")
    .replace(/[\u2018\u2019]/g,"'")
    .replace(/[\u201C\u201D]/g,'"')
    .replace(/\u00D7/g,"x")
    .replace(/\u2212/g,"-")
    .replace(/\u20B9/g,"Rs.")
    .replace(/\u2026/g,"...")
    .replace(/\u2022/g,"-")
    .replace(/\u2082/g,"2")
    .replace(/\u2192/g,"->")
    .replace(/\u2265/g,">=")
    .replace(/\u2264/g,"<=")
    .replace(/[^\x00-\xFF]/g,"?");
}

  var recent=state.auditLog.slice(-12).reverse();
  if(recent.length){
    table(["#","Time","Category","Change"],recent.map(function(e){
      var d=new Date(e.ts), t=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2);
      var ch=e.label+((e.from!==""||e.to!=="")?" ("+e.from+" -> "+e.to+")":""); if(ch.length>62) ch=ch.slice(0,59)+"...";
      return ["#"+e.id,t,e.category,ch];
    }),[14,40,26,100]);
  } else { label("Change log","No changes recorded"); }

  checkPage(50); y+=6;
  heading("9. Sign-Off & Revision Record");
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(15,23,42);
  ["Prepared by","Checked by","Approved by"].forEach(function(role){
    checkPage(14);
    doc.text(role+":",margin,y); doc.line(margin+30,y,margin+110,y);
    doc.text("Date:",margin+120,y); doc.line(margin+135,y,pageW-margin,y);
    y+=12;
  });
  doc.setFontSize(7.5); doc.setTextColor(140,150,165);
  doc.text(pdfSafe("Eco-Pave AI \u00B7 Developed by Satyam Yadav \u00B7 calculations derived live from the entered design inputs."),margin,pageH-10);

  state.reportRevision+=1;
  downloadPdfDoc(doc, pdfSafe(c.projectName).replace(/[^A-Za-z0-9]+/g,"_")+"_EcoPaveAI_DesignReport.pdf");
  pushToast("PDF Design Report generated","sync");
}

function renderReportModal(all){
  if(!state.reportOpen) return "";
  var generatedAt=new Date().toLocaleString();
  var reportText=buildPlainTextReport(state.config,all.design,all.carbon,all.boq,generatedAt,all.baseBoq,all);
  currentAll.__reportText=reportText;
  var locked=hasUnacknowledgedShortfall(all.design.layers);
  var lockAttr=locked?' disabled title="Acknowledge the below-catalogue thickness warning on the Configuration/Layers tab first"':'';
  return '<div class="modal-bg" onclick="if(event.target===this)closeReport()"><div class="modal">'+
    '<div class="modal-head"><div><h3>Design Report — '+esc(state.config.projectName)+'</h3><p>Generated '+generatedAt+'</p></div>'+
    '<button onclick="closeReport()" aria-label="Close">×</button></div>'+
    '<div class="modal-body"><pre>'+esc(reportText)+'</pre>'+
    (locked?'<p class="p-note" style="color:var(--amber);">Exports below are disabled: this design has a layer below the applicable IRC catalogue/code minimum that has not been acknowledged (Configuration/Layers tab).</p>':'')+
    '</div>'+
    '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeReport()">Close</button>'+
    '<button class="btn btn-ghost" onclick="downloadTxtReport()"'+lockAttr+'>Download .txt</button>'+
    '<button class="btn btn-signal" onclick="generatePdfReport()"'+lockAttr+'>Download PDF Report</button></div>'+
    '</div></div>';
}

function escA(s){ return esc(s).replace(/"/g,"&quot;"); }

// ---- lightweight DOM morph: patches the live DOM in place so focus, caret and slider drags survive every re-render ----
function morphChildren(from,to){
  var toKids=to.childNodes, i;
  for(i=0;i<toKids.length;i++){
    var t=toKids[i], f=from.childNodes[i];
    if(!f){ from.appendChild(t.cloneNode(true)); continue; }
    if(f.nodeType!==t.nodeType||f.nodeName!==t.nodeName){ from.replaceChild(t.cloneNode(true),f); continue; }
    if(t.nodeType===3||t.nodeType===8){ if(f.nodeValue!==t.nodeValue) f.nodeValue=t.nodeValue; continue; }
    morphEl(f,t);
  }
  while(from.childNodes.length>toKids.length) from.removeChild(from.lastChild);
}
function morphEl(f,t){
  var i, fa=f.attributes, ta=t.attributes;
  for(i=fa.length-1;i>=0;i--){ if(!t.hasAttribute(fa[i].name)) f.removeAttribute(fa[i].name); }
  for(i=0;i<ta.length;i++){ if(f.getAttribute(ta[i].name)!==ta[i].value) f.setAttribute(ta[i].name,ta[i].value); }
  var tag=f.nodeName, focused=(f===document.activeElement);
  if(tag==="INPUT"||tag==="TEXTAREA"){
    if(!focused){
      if(f.type==="checkbox"||f.type==="radio"){ if(f.checked!==t.checked) f.checked=t.checked; }
      else if(f.type!=="file"){ if(f.value!==t.value) f.value=t.value; }
    }
    return;
  }
  morphChildren(f,t);
  if(tag==="SELECT"&&!focused&&f.value!==t.value) f.value=t.value;
}

// ---- error boundaries ----
function errorPanel(err,scope){
  try{ console.error("[Eco-Pave AI] "+scope+" error:",err); }catch(e){}
  return '<div class="panel" style="border-color:var(--warn);"><div class="panel-header"><h3 style="color:var(--warn);">This section hit an error</h3></div><div class="panel-body">'+
    '<p class="p-note" style="margin:0 0 12px;">The rest of the app is unaffected \u2014 use the tabs above to keep working. Details: <span class="mono">'+esc(err&&err.message?err.message:String(err))+'</span></p>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-ghost" onclick="render()">Retry</button>'+
    '<button class="btn btn-ghost" onclick="selectSection(\'config\')">Go to Configuration</button>'+
    '<button class="btn btn-ghost" onclick="resetSavedData()">Reset saved data</button></div></div></div>';
}
function renderSection(all){
  switch(state.section){
    case "config": return renderConfig(state.config);
    case "layers": return renderLayers(all);
    case "carbon": return renderCarbon(all);
    case "boq": return renderBoq(all);
    case "cad": return renderCad(all.autolisp,all.design,state.config.geometry);
    case "geomsafety": return renderGeomSafety(state.config.roadDesign,state.config.geometry.numberOfLanes,state.config.geometry.crossFallPercent);
    case "rigid": return renderRigid(state.config.rigid,state.config.pavementType,state.config.geometry);
    case "compare": return renderCompare(all);
    default: return renderAudit();
  }
}

var currentAll=null;
function render(){
  var root=document.getElementById("root");
  try{
    var all=computeAll(); currentAll=all;
    all.__boqCsv=exportBoqToCsv(all.boq,state.config.projectName,state.config.pavementType);
    all.__carbonCsv=exportCarbonLedgerReport(all.carbon,state.config.projectName,all.boq,all.baseBoq);

    var designSig=JSON.stringify(all.design.msa)+JSON.stringify(all.design.layers);
    var cadSig=String(all.autolisp.script.length+all.autolisp.lineCount);
    if(!state._first){
      if(designSig!==state._designSig) pushToast("Calculations Synchronized with IRC:37","sync");
      if(cadSig!==state._cadSig) pushToast("AutoLISP Compiled Successfully","cad");
    }
    state._designSig=designSig; state._cadSig=cadSig; state._first=false;

    var body;
    try{ body=renderSection(all); }catch(secErr){ body=errorPanel(secErr,"Section '"+state.section+"'"); }
    if(state.viewMode==="simple"){
      body=renderSimpleSummary(all)+'<details class="simple-collapse"><summary>Show full technical detail (Expert data \u2014 same numbers, same terms)</summary>'+body+'</details>';
    }

    var html=''+
    '<div class="app">'+renderTopbar(all)+
    '<main><header class="top"><p class="eyebrow mono">'+sectionLabel(state.section)+'</p>'+
    '<h2>'+esc(state.config.projectName)+'</h2>'+
    '<p class="sub">Live calculations \u2014 every figure updates instantly across all tabs from IRC:37 / IRC:58 / IRC:SP:73 formulas, cradle-to-gate emission factors and quantity mathematics.</p></header>'+
    body+
    '<footer class="foot">Eco-Pave AI \u00B7 Independent civil engineering software developed by Satyam Yadav'+(state.storageOk?'':' \u00B7 <span style="color:var(--amber);">Browser storage unavailable \u2014 changes will not persist</span>')+'</footer>'+
    '</main></div>'+
    renderReportModal(all)+
    renderRevertConfirmModal()+
    renderOnboardingModal();

    var tabsEl=document.getElementById("tabs"), keepScroll=tabsEl?tabsEl.scrollLeft:0;
    var tpl=document.createElement("div"); tpl.innerHTML=html;
    morphChildren(root,tpl);

    tabsEl=document.getElementById("tabs");
    if(tabsEl){
      tabsEl.scrollLeft=keepScroll;
      if(state._lastSection!==state.section){
        var act=tabsEl.querySelector(".tab.active");
        if(act) tabsEl.scrollLeft=Math.max(0,act.offsetLeft-(tabsEl.clientWidth-act.offsetWidth)/2);
      }
    }
    state._lastSection=state.section;
    renderToasts();
    saveState();
  }catch(err){
    try{ console.error("[Eco-Pave AI] fatal render error:",err); }catch(e){}
    root.innerHTML='<div style="max-width:560px;margin:60px auto;padding:0 16px;">'+errorPanel(err,"Application")+'</div>';
  }
}
window.addEventListener("error",function(ev){ try{ pushToast("Unexpected error: "+(ev.message||"see console"),"err"); }catch(e){} });
render();
</script>
